name: Publish beta release

on:
  push:
    paths:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release asset hashes
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v0.1.6-beta'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/InventorySearchPrototype.dll \
              dist/InventorySearch-OneClick-v0.1.6-beta.zip \
              dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title 'Inventory Search v0.1.6 Beta' \
              --prerelease \
              --notes-file RELEASE_NOTES.md \
              dist/InventorySearchPrototype.dll \
              dist/InventorySearch-OneClick-v0.1.6-beta.zip \
              dist/SHA256SUMS.txt
          fi
