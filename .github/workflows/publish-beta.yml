name: Publish beta release

on:
  push:
    paths:
      - 'dist/**'
      - 'installer/**'
      - '.github/workflows/publish-beta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build one-click ZIP from current installer and verified DLL
        shell: bash
        run: |
          set -euo pipefail
          # Keep the DLL byte-for-byte identical to the working, tested build.
          echo '405662cb3023da2d6cdd7d5d8ef62457e624d654489da8fb729a8a3141bed515  dist/InventorySearchPrototype.dll' | sha256sum -c -
          stage="$(mktemp -d)"
          target="$stage/InventorySearch-OneClick-v0.1.6-beta"
          mkdir -p "$target/payload"
          cp -a installer/. "$target/"
          cp README.md "$target/README.md"
          cp dist/InventorySearchPrototype.dll "$target/payload/InventorySearchPrototype.dll"
          sha256sum "$target/payload/InventorySearchPrototype.dll" | cut -d' ' -f1 > "$target/payload/InventorySearchPrototype.sha256"
          (cd "$stage" && zip -q -r "$GITHUB_WORKSPACE/dist/InventorySearch-OneClick-v0.1.6-beta.zip" InventorySearch-OneClick-v0.1.6-beta)
          (cd dist && sha256sum InventorySearchPrototype.dll InventorySearch-OneClick-v0.1.6-beta.zip > SHA256SUMS.txt)
          (cd dist && sha256sum -c SHA256SUMS.txt)
          unzip -l dist/InventorySearch-OneClick-v0.1.6-beta.zip | grep -q '/payload/InventorySearchPrototype.dll'
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v0.1.6-beta'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/InventorySearchPrototype.dll \
              dist/InventorySearch-OneClick-v0.1.6-beta.zip \
              dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title 'Inventory Search v0.1.6 Beta' \
              --prerelease \
              --notes-file RELEASE_NOTES.md \
              dist/InventorySearchPrototype.dll \
              dist/InventorySearch-OneClick-v0.1.6-beta.zip \
              dist/SHA256SUMS.txt
          fi
