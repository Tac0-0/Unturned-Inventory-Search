name: Test v0.1.6 to v1.0.0 updater on Windows

on:
  push:
    paths:
      - 'installer/Update.ps1'
      - 'installer/UPDATE-NOW.cmd'
      - '.github/workflows/test-updater-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test actual Windows PowerShell 5.1 updater with a dummy Unturned installation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $game = Join-Path $env:RUNNER_TEMP 'Unturned-Update-Test'
          $plugin = Join-Path $game 'BepInEx\plugins\InventorySearchPrototype'
          New-Item -ItemType Directory -Force -Path $plugin | Out-Null
          Set-Content -LiteralPath (Join-Path $game 'Unturned.exe') -Value 'test-only dummy executable'
          $target = Join-Path $plugin 'InventorySearchPrototype.dll'
          Copy-Item -LiteralPath 'dist\InventorySearchPrototype.dll' -Destination $target
          $state = Join-Path $env:LOCALAPPDATA 'InventorySearch'
          New-Item -ItemType Directory -Force -Path $state | Out-Null
          @{
            gamePath = $game
            repository = 'Tac0-0/Unturned-Inventory-Search'
            assetName = 'InventorySearchPrototype.dll'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $state 'config.json') -Encoding UTF8
          $oldHash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($oldHash -ne '405662cb3023da2d6cdd7d5d8ef62457e624d654489da8fb729a8a3141bed515') {
            throw 'Test fixture is not the v0.1.6 DLL.'
          }
          $log1 = (& powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File '.\installer\Update.ps1' 2>&1 | Out-String)
          Write-Host $log1
          if ($LASTEXITCODE -ne 0) { throw "First update failed with exit code $LASTEXITCODE" }
          if ($log1 -notmatch 'Inventory Search updated from official release: v1.0.0') {
            throw "First updater run did not report v1.0.0."
          }
          $newHash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($newHash -ne 'a45df1ee2202b05a20cdaf98bbfdbd8ad016113e7536381e9a9cb30f072aefc2') {
            throw "Installed DLL hash mismatch after update: $newHash"
          }
          $backupHash = (Get-FileHash -LiteralPath (Join-Path $state 'InventorySearchPrototype.previous.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($backupHash -ne $oldHash) { throw 'Backup does not match original v0.1.6 DLL' }
          $log2 = (& powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File '.\installer\Update.ps1' 2>&1 | Out-String)
          Write-Host $log2
          if ($LASTEXITCODE -ne 0) { throw "Second update failed with exit code $LASTEXITCODE" }
          if ($log2 -notmatch 'Inventory Search is already up to date') {
            throw "Second updater run did not report up-to-date."
          }
          Write-Host 'PASS: v0.1.6 -> v1.0.0 -> already-up-to-date. Backup verified.'
